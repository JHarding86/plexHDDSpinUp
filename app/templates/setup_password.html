{% extends "base.html" %}
{% block content %}
<h2>Setup</h2>
{% include "_steps.html" %}
<article>
  <h3>{{ "Change" if has_pw else "Set" }} the UI password</h3>
  <p class="muted">This page stores your Plex token, so it's protected by a password even on your LAN.</p>
  <form method="post" action="{{ url_for('ui.setup_password') }}">
    <input type="password" name="password" placeholder="New password" minlength="6" required autofocus>
    <input type="password" name="confirm" placeholder="Confirm password" minlength="6" required>
    <button type="submit">Save and continue</button>
  </form>
</article>
{% endblock %}
